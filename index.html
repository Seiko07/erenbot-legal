    :root { color-scheme: dark; --bg:#11131a; --panel:#1c202b; --text:#e6e9f2; --muted:#b4bdcc; --accent:#5865f2; }

    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--bg); color:var(--text); font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif; }
    main { width:min(700px,100%); padding:clamp(26px,6vw,52px); background:var(--panel); border:1px solid #303644; border-radius:18px; }
    h1 { margin:0 0 10px; } p { color:var(--muted); }
    ul { display:grid; gap:12px; padding:0; list-style:none; }
    a { display:block; padding:15px 18px; border:1px solid #363d50; border-radius:10px; color:#cbd1ff; text-decoration:none; }
    a:hover { border-color:var(--accent); background:#222638; }

</head>
